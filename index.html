<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JT Automotive Aesthetics</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      background-image: radial-gradient(circle at top, #002200 0%, #000 80%);
      color: #fff;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .logo {
      width: 200px;
      height: auto;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 400;
      color: #fff;
      margin-bottom: 40px;
      text-shadow: 0 0 6px #0f0;
    }
    .btn {
      display: block;
      width: 260px;
      padding: 15px;
      margin: 15px auto;
      background: #000;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      border: 2px solid #0f0;
      border-radius: 30px;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 0 8px #0f0;
    }
    .btn:hover {
      background: #0f0;
      color: #000;
      box-shadow: 0 0 15px #0f0;
      transform: scale(1.05);
    }
    footer {
      margin-top: 50px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="JT Automotive Aesthetics Logo" class="logo">
    <h1>Premium Detailing | Michigan</h1>

    <a href="https://docs.google.com/forms/d/1-x3FnKuG-iZmZJJBDr7jtu-lfQOWzYSfZV99Rn0_zYc/viewform" class="btn" target="_blank">Book a Service</a>
    <a href="https://www.facebook.com/jtautomotiveaesthetics" class="btn" target="_blank">Facebook Page</a>
    <a href="https://www.instagram.com/jtautoaesthetics/" class="btn" target="_blank">Instagram Page</a>

    <footer>
      © 2025 JT Automotive Aesthetics
    </footer>
  </div>
</body>
</html>
